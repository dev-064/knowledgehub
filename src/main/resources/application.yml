spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cognitex
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

ollama:
  base-url: http://localhost:11434
  embedding:
    model: nomic-embed-text
  llm:
    model: llama3.2
